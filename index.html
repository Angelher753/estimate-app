<div style="max-width:860px;margin:0 auto;padding:18px;border:1px solid #e6e6e6;border-radius:12px;">
  <h2 style="margin:0 0 12px 0;">Re-Plaster Estimate</h2>
  <p style="margin:0 0 18px 0;opacity:.8;">
    Internal only. Subject to accounting approval.
  </p>

  <!-- POOL -->
  <div style="padding:14px;border:1px solid #f0f0f0;border-radius:10px;margin-bottom:14px;">
    <h3 style="margin:0 0 10px 0;">Pool</h3>

    <label>Pool Type</label>
    <select id="poolType" style="width:100%;padding:10px;margin:6px 0 12px 0;">
      <option value="rect">Standard Rectangle</option>
      <option value="freeform">Freeform (Manual Total LF)</option>
      <option value="custom">Custom</option>
    </select>

    <!-- Rectangle Inputs -->
    <div id="poolRect" style="display:block;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;">
          <label>Pool Length (ft)</label>
          <input id="Lp" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="e.g. 30">
        </div>
        <div style="flex:1;min-width:160px;">
          <label>Pool Width (ft)</label>
          <input id="Wp" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="e.g. 15">
        </div>
      </div>
    </div>

    <!-- Freeform Inputs -->
    <div id="poolFreeform" style="display:none;">
      <label>Pool Total Linear Feet (LF)</label>
      <input id="poolManualLF" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="Enter measured total LF">
    </div>

    <!-- Custom Inputs -->
    <div id="poolCustom" style="display:none;">
      <label>Custom Mode</label>
      <div style="display:flex;gap:14px;align-items:center;margin:6px 0 12px 0;flex-wrap:wrap;">
        <label><input type="radio" name="poolCustomMode" value="dims" checked> Enter Lengths/Widths</label>
        <label><input type="radio" name="poolCustomMode" value="manual"> Manual Total LF</label>
      </div>

      <div id="poolDims">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div style="flex:1;min-width:120px;"><label>Length 1</label><input id="pL1" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
          <div style="flex:1;min-width:120px;"><label>Length 2</label><input id="pL2" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
          <div style="flex:1;min-width:120px;"><label>Width 1</label><input id="pW1" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
          <div style="flex:1;min-width:120px;"><label>Width 2</label><input id="pW2" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
        </div>
      </div>

      <div id="poolCustomManual" style="display:none;">
        <label>Pool Total Linear Feet (LF)</label>
        <input id="poolCustomLF" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;">
      </div>
    </div>
  </div>

  <!-- SPA -->
  <div style="padding:14px;border:1px solid #f0f0f0;border-radius:10px;margin-bottom:14px;">
    <h3 style="margin:0 0 10px 0;">Spa</h3>

    <label>Spa Type</label>
    <select id="spaType" style="width:100%;padding:10px;margin:6px 0 12px 0;">
      <option value="none">None</option>
      <option value="rect">Standard Rectangle</option>
      <option value="custom">Custom</option>
    </select>

    <div id="spaRect" style="display:none;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;">
          <label>Spa Length (ft)</label>
          <input id="Ls" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="e.g. 7">
        </div>
        <div style="flex:1;min-width:160px;">
          <label>Spa Width (ft)</label>
          <input id="Ws" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="e.g. 7">
        </div>
      </div>
    </div>

    <div id="spaCustom" style="display:none;">
      <label>Custom Mode</label>
      <div style="display:flex;gap:14px;align-items:center;margin:6px 0 12px 0;flex-wrap:wrap;">
        <label><input type="radio" name="spaCustomMode" value="dims" checked> Enter Lengths/Widths</label>
        <label><input type="radio" name="spaCustomMode" value="manual"> Manual Total LF</label>
      </div>

      <div id="spaDims">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div style="flex:1;min-width:120px;"><label>Length 1</label><input id="sL1" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
          <div style="flex:1;min-width:120px;"><label>Length 2</label><input id="sL2" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
          <div style="flex:1;min-width:120px;"><label>Width 1</label><input id="sW1" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
          <div style="flex:1;min-width:120px;"><label>Width 2</label><input id="sW2" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;"></div>
        </div>
      </div>

      <div id="spaCustomManual" style="display:none;">
        <label>Spa Total Linear Feet (LF)</label>
        <input id="spaCustomLF" type="number" min="0" step="0.1" style="width:100%;padding:10px;margin:6px 0 12px 0;">
      </div>
    </div>
  </div>

  <!-- OPTIONS -->
  <div style="padding:14px;border:1px solid #f0f0f0;border-radius:10px;margin-bottom:14px;">
    <h3 style="margin:0 0 10px 0;">Options</h3>

    <label>Finish</label>
    <select id="finishRate" style="width:100%;padding:10px;margin:6px 0 12px 0;">
      <option value="60">Plaster</option>
      <option value="80">Mini Pebble</option>
      <option value="115">Micro Pebble</option>
      <option value="155">Hydrazzo</option>
    </select>

    <div style="display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 12px 0;">
      <label style="display:flex;align-items:center;gap:10px;">
        <input id="addTile" type="checkbox">
        Include Tile Replacement
      </label>

      <label style="display:flex;align-items:center;gap:10px;">
        <input id="addCoping" type="checkbox">
        Include Coping
      </label>

      <label style="display:flex;align-items:center;gap:10px;">
        <input id="permit" type="checkbox">
        Include Permit
      </label>
    </div>

    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <button id="calcBtn" type="button" style="padding:12px 16px;border-radius:10px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;">
        Calculate
      </button>
      <button id="resetBtn" type="button" style="padding:12px 16px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;">
        Reset
      </button>
    </div>
  </div>

  <!-- SAVE / EMAIL -->
  <div style="margin-top:14px;border-top:1px solid #eee;padding-top:12px;">
    <h4 style="margin:0 0 10px 0;">Save / Email</h4>

    <label>Job Name (Name + City)</label>
    <input id="jobName" type="text" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="e.g. Alan - Pasadena">

    <label>Notes</label>
    <textarea id="jobNotes" rows="3" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="e.g. 2 estimates: with tile + without tile"></textarea>

    <label>Your Email (to)</label>
    <input id="toEmail" type="email" style="width:100%;padding:10px;margin:6px 0 12px 0;" placeholder="you@3mpools.com">

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button id="emailBtn" type="button" style="padding:12px 16px;border-radius:10px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;">
        Send to Email
      </button>
      <button id="saveBtn" type="button" style="padding:12px 16px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;">
        Save to This Device
      </button>
    </div>
  </div>

  <!-- OUTPUT -->
  <div style="padding:14px;border:1px solid #eaeaea;border-radius:10px;background:#fafafa;">
    <h3 style="margin:0 0 10px 0;">Your Estimate</h3>
    <div id="out" style="font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;white-space:pre-wrap;">
Pool LF: —
Spa LF: —
Total LF: —
Finish: —
Add-ons: —
ESTIMATE: —
    </div>
  </div>

  <p style="margin:14px 0 0 0;opacity:.65;font-size:12px;">
    Subject to accounting approval.
  </p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const num = (v) => {
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : 0;
  };
  const money = (v) => v.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 });

  // Locked rates (kept out of sight)
  const RATES = {
    demo_per_lf: 25,
    tile_per_lf: 35,
    coping_per_lf: 45,
    permit_flat: 900,
    buffer_pct: 0.10
  };

  function updatePoolUI() {
    const t = $("poolType").value;
    $("poolRect").style.display = (t === "rect") ? "block" : "none";
    $("poolFreeform").style.display = (t === "freeform") ? "block" : "none";
    $("poolCustom").style.display = (t === "custom") ? "block" : "none";
  }

  function updatePoolCustomMode() {
    const mode = document.querySelector('input[name="poolCustomMode"]:checked')?.value || "dims";
    $("poolDims").style.display = (mode === "dims") ? "block" : "none";
    $("poolCustomManual").style.display = (mode === "manual") ? "block" : "none";
  }

  function updateSpaUI() {
    const t = $("spaType").value;
    $("spaRect").style.display = (t === "rect") ? "block" : "none";
    $("spaCustom").style.display = (t === "custom") ? "block" : "none";
  }

  function updateSpaCustomMode() {
    const mode = document.querySelector('input[name="spaCustomMode"]:checked')?.value || "dims";
    $("spaDims").style.display = (mode === "dims") ? "block" : "none";
    $("spaCustomManual").style.display = (mode === "manual") ? "block" : "none";
  }

  function computePoolLF() {
    const t = $("poolType").value;

    if (t === "rect") {
      const Lp = num($("Lp").value);
      const Wp = num($("Wp").value);
      return 2 * Lp + 2 * Wp;
    }

    if (t === "freeform") return num($("poolManualLF").value);

    const mode = document.querySelector('input[name="poolCustomMode"]:checked')?.value || "dims";
    if (mode === "manual") return num($("poolCustomLF").value);

    return num($("pL1").value) + num($("pL2").value) + num($("pW1").value) + num($("pW2").value);
  }

  function computeSpaLF() {
    const t = $("spaType").value;
    if (t === "none") return 0;

    if (t === "rect") {
      const Ls = num($("Ls").value);
      const Ws = num($("Ws").value);
      return 2 * Ls + 2 * Ws;
    }

    const mode = document.querySelector('input[name="spaCustomMode"]:checked')?.value || "dims";
    if (mode === "manual") return num($("spaCustomLF").value);

    return num($("sL1").value) + num($("sL2").value) + num($("sW1").value) + num($("sW2").value);
  }

  function selectedAddonsLabel() {
    const addons = [];
    if ($("addTile").checked) addons.push("Tile Replacement");
    if ($("addCoping").checked) addons.push("Coping");
    if ($("permit").checked) addons.push("Permit");
    return addons.length ? addons.join(", ") : "None";
  }

  function computeNumbers() {
    const poolLF = computePoolLF();
    const spaLF = computeSpaLF();
    const totalLF = poolLF + spaLF;

    const finishRate = num($("finishRate").value);
    const base = totalLF * (RATES.demo_per_lf + finishRate);

    const tileCost = $("addTile").checked ? totalLF * RATES.tile_per_lf : 0;
    const copingCost = $("addCoping").checked ? totalLF * RATES.coping_per_lf : 0;
    const permitCost = $("permit").checked ? RATES.permit_flat : 0;

    const actual = base + tileCost + copingCost + permitCost;
    const bufferAmt = actual * RATES.buffer_pct;

    return {
      poolLF,
      spaLF,
      totalLF,
      finishLabel: $("finishRate").selectedOptions[0]?.textContent || "",
      addonsLabel: selectedAddonsLabel(),
      estimateLow: actual,
      estimateHigh: actual + bufferAmt
    };
  }

  function calculate() {
    const x = computeNumbers();

    $("out").textContent =
`Pool LF: ${x.poolLF.toFixed(1)}
Spa LF: ${x.spaLF.toFixed(1)}
Total LF: ${x.totalLF.toFixed(1)}
Finish: ${x.finishLabel}
Add-ons: ${x.addonsLabel}
ESTIMATE: ${money(x.estimateLow)} - ${money(x.estimateHigh)}`;
  }

  function getEstimateSummary() {
    const x = computeNumbers();

    const jobName = ($("jobName")?.value || "").trim();
    const notes = ($("jobNotes")?.value || "").trim();

    const lines = [
      `Job: ${jobName || "—"}`,
      `Date: ${new Date().toLocaleString()}`,
      ``,
      `Pool LF: ${x.poolLF.toFixed(1)}`,
      `Spa LF: ${x.spaLF.toFixed(1)}`,
      `Total LF: ${x.totalLF.toFixed(1)}`,
      `Finish: ${x.finishLabel}`,
      `Add-ons: ${x.addonsLabel}`,
      ``,
      `ESTIMATE: ${money(x.estimateLow)} - ${money(x.estimateHigh)}`
    ];

    if (notes) lines.push(``, `Notes:`, notes);

    return lines.join("\n");
  }

  function sendToEmail() {
    calculate();
    const to = ($("toEmail")?.value || "").trim();
    const jobName = ($("jobName")?.value || "").trim();
    const subject = `Estimate - ${jobName || "Pool/Spa"}`;
    const body = getEstimateSummary();

    const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }

  function saveToDevice() {
    calculate();

    const safeName = ($("jobName")?.value || "estimate")
      .trim()
      .replace(/[^\w\- ]+/g, "")
      .replace(/\s+/g, " ");

    const filename = `${safeName || "estimate"} - ${new Date().toISOString().slice(0,10)}.txt`;

    const text = getEstimateSummary();
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
  }

  function resetAll() { location.reload(); }

  $("poolType").addEventListener("change", () => { updatePoolUI(); updatePoolCustomMode(); });
  document.querySelectorAll('input[name="poolCustomMode"]').forEach(r => r.addEventListener("change", updatePoolCustomMode));

  $("spaType").addEventListener("change", () => { updateSpaUI(); updateSpaCustomMode(); });
  document.querySelectorAll('input[name="spaCustomMode"]').forEach(r => r.addEventListener("change", updateSpaCustomMode));

  $("calcBtn").addEventListener("click", calculate);
  $("resetBtn").addEventListener("click", resetAll);

  $("emailBtn").addEventListener("click", sendToEmail);
  $("saveBtn").addEventListener("click", saveToDevice);

  updatePoolUI(); updatePoolCustomMode(); updateSpaUI(); updateSpaCustomMode();
</script>
